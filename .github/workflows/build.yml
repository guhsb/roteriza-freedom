name: Gerar Roteiriza.exe

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install pyinstaller pywebview==5.3.2 rapidocr_onnxruntime==1.4.4 pypdfium2

      - name: Gerar o programa (pasta com .exe)
        run: >
          pyinstaller --noconfirm --clean --onedir --noconsole
          --name Roteiriza
          --icon roteiriza.ico
          --add-data "web;web"
          --collect-all webview
          --collect-all pythonnet
          --collect-all clr_loader
          --collect-all rapidocr_onnxruntime
          --collect-all onnxruntime
          --collect-all pypdfium2
          --collect-all shapely
          --collect-all pyclipper
          app.py

      - name: Compactar
        shell: pwsh
        run: |
          Copy-Item LEIA-ME.txt dist/Roteiriza/
          Compress-Archive -Path dist/Roteiriza/* -DestinationPath Roteiriza.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Roteiriza
          path: Roteiriza.zip

      - name: Publicar Release (quando for uma tag vX.Y)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Roteiriza.zip
